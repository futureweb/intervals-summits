configuration:
  intervals_api_key:
    name: Intervals API key
    description: Intervals.icu → Settings → Developer Settings. The same key as the Garmin bridge's is fine.
  write_to_intervals:
    name: Write to Intervals
    description: Off = a dry run – the summit log fills, nothing is written to Intervals. On = the fields are written.
  language:
    name: Language
    description: Names of the fields it creates, and the summit log page (en or de).
  description_line:
    name: Line in the description
    description: Also "⛰️ Summits …" in the activity description, so Intervals' search finds your summits. Only that line is ever touched.
  huts_passes:
    name: Huts and passes
    description: Two more text fields, Huts and Passes, with the huts and passes of each activity – and in the description line too, when it is on.
  types:
    name: Only these activity types
    description: Comma-separated, e.g. Hike,BackcountrySki. Empty = every outdoor type.
  peak_radius:
    name: Summit radius (m)
    description: How close the track must come to a summit, 10–200 m. Empty = 100.
  peak_below:
    name: Below the summit (m)
    description: How far below the summit the track may be there, 0–500 m. Empty = 80.
  hut_radius:
    name: Hut radius (m)
    description: 10–200 m. Empty = 60.
  pass_radius:
    name: Pass radius (m)
    description: 10–200 m. Empty = 60.
  charts:
    name: Intervals charts
    description: Two private charts in Intervals, summits per week and per month (with Write to Intervals on).
  collections:
    name: Collections
    description: "All summits of an area above a height, e.g. Tirol 3000ers=r52343>=3000; Kaisergebirge=r2115422 (the area: its OpenStreetMap name or r<relation id>)."
  backfill_from:
    name: Backfill from (YYYY-MM-DD)
    description: Goes through your past activities from this date once, at the next start (and once more when writing is switched on).
