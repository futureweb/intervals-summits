name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: pip install -e ".[dev]"
      # the summit log page in a real browser: no script error, hover and pin work
      - name: Headless Chromium
        if: runner.os == 'Linux'
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: pytest -q -rs
      - run: intervals-summits --version
  # what publish.yml builds on a release, checked on every push
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - run: python -m build && python -m twine check dist/*
      - run: pip install dist/*.whl && intervals-summits --version
