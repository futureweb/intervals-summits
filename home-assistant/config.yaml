name: Intervals Summits
version: "0.2.1"
slug: intervals_summits
description: Summits, huts and passes on your Intervals.icu activities – and your summit log in the sidebar
url: https://github.com/futureweb/intervals-summits
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8766
panel_icon: mdi:image-filter-hdr
panel_title: Summits
backup: hot
timeout: 30
options:
  intervals_api_key: ""
  write_to_intervals: false
  language: en
  description_line: false
  huts_passes: false
  charts: true
schema:
  intervals_api_key: password
  write_to_intervals: bool
  language: list(en|de)
  description_line: bool
  huts_passes: bool
  types: str?
  charts: bool
  collections: str?
  peak_radius: int(10,200)?
  peak_below: int(0,500)?
  hut_radius: int(10,200)?
  pass_radius: int(10,200)?
  backfill_from: match(^\d{4}-\d{2}-\d{2}$)?
